<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#090a0d" />
    <title>Procedural World</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <header id="topbar">
      <span class="brand">Procedural World</span>
      <label class="seed">seed <input id="seed" type="text" inputmode="numeric" spellcheck="false" /></label>
      <button id="dice" title="Random seed">🎲</button>
      <button id="build" title="Full-quality build (B)">Build</button>
      <button id="mode" title="Switch between the 3D world and the 2D raster view (V)">2D</button>
      <button id="atlas-toggle" title="Atlas of named places (A)">Atlas</button>
      <button id="export-toggle" title="Export a screenshot, heightmap or the world; copy a share link" aria-haspopup="menu" aria-expanded="false">Export</button>
      <button id="panel-toggle" class="drawer-only" title="Settings">☰</button>
      <div id="progress"></div>
    </header>
    <aside id="panel"></aside>
    <div id="compass-host"></div>
    <section id="layers">
      <button id="layers-toggle" type="button" title="Show or hide the layer controls" aria-label="Layer controls" aria-expanded="true"></button>
      <select id="layer-select" title="Layer"></select>
      <label class="exag" title="Colouring of the realistic view">palette <select id="palette">
          <option value="satellite">Satellite</option>
          <option value="stylised">Stylised</option>
          <option value="hypsometric">Hypsometric</option>
        </select></label>
      <label class="exag" title="Vertical exaggeration of the 3D terrain">relief × <input id="exag" type="range" min="1" max="5" step="0.25" value="1.5" /><span id="exag-value">1.5</span></label>
      <div id="legend"></div>
      <div id="inspect"></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
